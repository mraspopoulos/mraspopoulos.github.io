name: Refresh citation stats

on:
  schedule:
    - cron: '0 5 * * *'   # Every day at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch per-paper citations and compute aggregate stats
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: node scripts/fetch-citations.mjs

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json src/data/citations.json src/data/missing.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh citation stats (Semantic Scholar)"
            git push
          fi
