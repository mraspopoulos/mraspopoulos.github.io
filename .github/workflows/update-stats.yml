name: Refresh citation stats

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Semantic Scholar stats and citations
        env:
          ORCID: 0000-0003-1513-6018
          AUTHOR_NAME: Marios Raspopoulos
          AFFILIATION_HINT: UCLan
          # Force-include specific author IDs if auto-detection misses one.
          # Comma-separated. Leave empty for auto-detect only.
          MANUAL_AUTHOR_IDS: ""
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: node scripts/fetch-citations.mjs

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json src/data/citations.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh citation stats (Semantic Scholar) [skip ci]"
            git push
          fi
